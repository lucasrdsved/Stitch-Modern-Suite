kind = "web"
previewPath = "/"
title = "TrainFlow"
version = "1.0.0"
id = "artifacts/trainflow"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22378

[services.development]
run = "pnpm --filter @workspace/trainflow run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/trainflow", "run", "build" ]
publicDir = "artifacts/trainflow/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22378"
BASE_PATH = "/"
