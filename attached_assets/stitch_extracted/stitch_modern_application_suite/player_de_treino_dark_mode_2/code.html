<style>
        body {
            background-color: theme('colors.pure-black');
            color: theme('colors.on-background');
        }
        .glass-panel {
            background-color: theme('colors.surface-container-low');
            border: 1px solid theme('colors.border-subtle');
        }
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Animations */
        @keyframes entrance {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes badgeEntrance {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes ambientPulse {
            0%, 100% { box-shadow: 0 0 20px rgba(200, 241, 53, 0.2); }
            50% { box-shadow: 0 0 35px rgba(200, 241, 53, 0.4); }
        }

        @keyframes buttonGlow {
            0% { box-shadow: 0 0 0 0 rgba(200, 241, 53, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(200, 241, 53, 0); }
            100% { box-shadow: 0 0 0 0 rgba(200, 241, 53, 0); }
        }

        @keyframes checkFade {
            0% { opacity: 0; transform: scale(0.5); }
            50% { opacity: 1; transform: scale(1.2); }
            100% { opacity: 0; transform: scale(1); }
        }

        @keyframes timerRotate {
            from { stroke-dashoffset: 100; }
            to { stroke-dashoffset: 25; }
        }

        .animate-entrance { animation: entrance 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-badge { animation: badgeEntrance 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both; }
        .animate-ambient { animation: ambientPulse 3s ease-in-out infinite; }
        .animate-timer { animation: timerRotate 20s linear infinite; }

        @media (prefers-reduced-motion: reduce) {
            .animate-entrance, .animate-badge, .animate-ambient, .animate-timer, .transition-all, .transition-colors, .transition-opacity {
                animation: none !important;
                transition: none !important;
                transform: none !important;
            }
        }
    </style>
<style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col overflow-hidden pb-8 bg-pure-black">
<!-- Top Navigation Bar -->
<header class="flex items-center justify-between px-container-margin h-button-height-standard w-full z-50 bg-pure-black border-b border-border-subtle shrink-0">
<button class="w-touch-target-min h-touch-target-min flex items-center justify-center text-on-surface hover:opacity-80 transition-opacity active:scale-90">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
<div class="flex items-center gap-4">
<span class="font-headline-md text-headline-md text-on-background">3/8</span>
<div class="relative w-8 h-8">
<svg class="w-full h-full transform -rotate-90" viewbox="0 0 36 36">
<circle class="stroke-surface-variant" cx="18" cy="18" fill="none" r="16" stroke-width="3"></circle>
<circle class="stroke-primary-fixed animate-timer" cx="18" cy="18" fill="none" r="16" stroke-dasharray="100" stroke-dashoffset="100" stroke-linecap="round" stroke-width="3"></circle>
</svg>
</div>
</div>
</header>
<!-- Main Workout Area -->
<main class="flex-1 flex flex-col px-gutter overflow-y-auto w-full max-w-md mx-auto no-scrollbar gap-stack-gap-lg pt-6 bg-pure-black">
<!-- Exercise Media Container -->
<div class="animate-entrance w-full aspect-[4/3] bg-surface-container-low rounded-xl overflow-hidden relative shadow-2xl border border-border-subtle">
<img alt="Exercise Demo" class="w-full h-full object-cover opacity-60" data-alt="A powerful athlete performing a heavy barbell back squat in a dark, grimy industrial gym setting." src="https://lh3.googleusercontent.com/aida/ADBb0ugGCayf2R6meX7XkzQt_ul6hBHqvvoJqo9Gk8xbpAKWi7I54AdW6ockjD36od4x4x-DbQ_64qRrHDrmrfo68DZ3Ioprgv3IE4Fr-yWx9w2Bb2RgC6nbbp0XacVNrQ65aTmdNbaJmxXUMAprYjQWaZXPYSnbIq11I8StcgusGAgFgWBWMoUihjLuAEVHUkGJGyhh_h-epAYCcLUoW7H0AVfDry7fgt5vCkD1qDT_czXcELRlAd3kPdBDMZ0"/>
<div class="absolute inset-0 bg-gradient-to-t from-pure-black via-pure-black/20 to-transparent"></div>
<div class="absolute bottom-4 left-4 right-4 flex justify-between items-end">
<div>
<h1 class="font-headline-lg text-headline-lg text-primary-fixed uppercase leading-none mb-1">Barbell Back Squat</h1>
<p class="font-label-md text-label-md text-secondary-fixed-dim">Legs • Quadriceps</p>
</div>
<div class="animate-badge flex flex-col items-end">
<span class="font-headline-md text-headline-md text-primary-fixed">SET 3</span>

</div>
</div>
<!-- Logger Section -->
<div class="flex flex-col gap-4">
<div class="flex gap-4">

<label class="font-label-sm text-label-sm text-secondary-fixed-dim absolute top-3 uppercase tracking-wider">KG</label>
<input class="w-full h-20 bg-transparent text-center font-display-lg text-display-lg text-on-background focus:outline-none focus:ring-0 border-none mt-4 placeholder:text-surface-variant" data-target="100" id="kg-input" placeholder="000" type="number" value="0"/>
</div>
<div class="flex-1 bg-surface-container-low border border-border-subtle rounded-xl p-4 flex flex-col items-center justify-center relative focus-within:border-primary-fixed transition-all duration-300">
<label class="font-label-sm text-label-sm text-secondary-fixed-dim absolute top-3 uppercase tracking-wider">REPS</label>
<input class="w-full h-20 bg-transparent text-center font-display-lg text-display-lg text-on-background focus:outline-none focus:ring-0 border-none mt-4 placeholder:text-surface-variant" data-target="8" id="reps-input" placeholder="00" type="number" value="0"/>
</div>
</div>
<div class="relative">
<button class="animate-ambient w-full h-button-height-standard bg-primary-fixed rounded-full flex items-center justify-center font-headline-md text-headline-md text-pure-black uppercase hover:brightness-110 active:scale-[0.97] transition-all mt-2 relative overflow-hidden" id="confirm-btn">

</button>
<div class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-0 z-20" id="check-overlay">

</div>

<div class="mt-auto flex justify-center items-center gap-10 py-6">

<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">skip_previous</span>
</button>
<button class="w-16 h-16 rounded-full bg-surface-container-low border border-primary-fixed/20 flex items-center justify-center text-on-background hover:text-primary-fixed transition-all active:scale-90 hover:border-primary-fixed shadow-lg">
<span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1;">pause</span>
</button>
<button class="w-touch-target-min h-touch-target-min flex items-center justify-center text-on-surface hover:text-primary-fixed transition-all active:scale-90">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">skip_next</span>
</button>
</div>
</main>
<script>
    // Number Counting Animation
    function animateCounter(id, target) {
        const input = document.getElementById(id);
        if (!input) return;
        
        let start = 0;
        const duration = 1200;
        const startTime = performance.now();
        
        function update(currentTime) {
            const elapsed = currentTime - startTime;
            const progress = Math.min(elapsed / duration, 1);
            
            // Ease out quad
            const easeValue = progress * (2 - progress);
            const currentCount = Math.floor(easeValue * target);
            
            input.value = currentCount;
            
            if (progress < 1) {
                requestAnimationFrame(update);
            } else {
                input.value = target;
            }
        }
        
        requestAnimationFrame(update);
    }

    // Initialize counters on load
    window.addEventListener('DOMContentLoaded', () => {
        const kgTarget = parseInt(document.getElementById('kg-input').dataset.target);
        const repsTarget = parseInt(document.getElementById('reps-input').dataset.target);
        
        // Respect reduced motion
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            document.getElementById('kg-input').value = kgTarget;
            document.getElementById('reps-input').value = repsTarget;
        } else {
            setTimeout(() => {
                animateCounter('kg-input', kgTarget);
                animateCounter('reps-input', repsTarget);
            }, 300);
        }
    });

    // Confirm Button Haptics & Visuals
    const confirmBtn = document.getElementById('confirm-btn');
    const checkOverlay = document.getElementById('check-overlay');

    confirmBtn.addEventListener('click', () => {
        // Trigger pulse/glow animation
        confirmBtn.style.animation = 'none';
        confirmBtn.offsetHeight; // Trigger reflow
        confirmBtn.style.animation = 'buttonGlow 0.6s ease-out forwards';
        
        // Show check overlay
        checkOverlay.style.animation = 'none';
        checkOverlay.offsetHeight; // Trigger reflow
        checkOverlay.style.animation = 'checkFade 1s cubic-bezier(0.16, 1, 0.3, 1) forwards';

        // Brief delay before returning to ambient pulse
        setTimeout(() => {
            if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                confirmBtn.style.animation = 'ambientPulse 3s ease-in-out infinite';
            }
        }, 1000);
    });
</script>
