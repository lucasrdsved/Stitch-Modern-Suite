<script>
        // Simple Interaction logic for tabs
        const tabs = document.querySelectorAll('section button.font-headline-md');
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active-tab', 'text-on-surface'));
                tabs.forEach(t => t.classList.add('text-text-muted'));
                tab.classList.add('active-tab', 'text-on-surface');
                tab.classList.remove('text-text-muted');
            });
        });

        // Hover effect for cards
        const cards = document.querySelectorAll('.exercise-card');
        cards.forEach(card => {
            card.addEventListener('mouseenter', () => {
                card.classList.add('bg-surface-container');
            });
            card.addEventListener('mouseleave', () => {
                card.classList.remove('bg-surface-container');
            });
        });
    </script>
